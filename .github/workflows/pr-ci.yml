name: PR CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: test

  ldt:
    name: Live Dependency Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # A merge to main redeploys dev and the app takes ~110s to boot. Without
      # this gate an LDT run landing in that window gets nginx 502s on every
      # scenario and reports as a code failure.
      - name: Wait for dev API to be healthy
        env:
          LDT_BASE_URL: https://api-dev.ohyeahsaas.com
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LDT_BASE_URL/actuator/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "dev API healthy after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i/30: got $code — retrying in 10s"
            sleep 10
          done
          echo "::error::dev API did not become healthy within 5 minutes — LDTs not run"
          exit 1

      - name: Run Cucumber LDTs
        run: cd e2e && mvn test -B
        continue-on-error: true
        env:
          LDT_BASE_URL: https://api-dev.ohyeahsaas.com
          LDT_STUDENT_EMAIL: ${{ secrets.LDT_STUDENT_EMAIL }}
          LDT_STUDENT_PASSWORD: ${{ secrets.LDT_STUDENT_PASSWORD }}
          LDT_GENERAL_EMAIL: ${{ secrets.LDT_GENERAL_EMAIL }}
          LDT_GENERAL_PASSWORD: ${{ secrets.LDT_GENERAL_PASSWORD }}

      - name: Post LDT results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: e2e/target/surefire-reports/*.xml
          check_name: LDT Results
          comment_title: LDT Results
          fail_on: test failures
