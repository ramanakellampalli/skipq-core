name: PR CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: test

  ldt:
    name: Live Dependency Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Cucumber LDTs
        run: cd e2e && mvn test -B
        continue-on-error: true
        env:
          LDT_BASE_URL: https://api-dev.ohyeahsaas.com
          LDT_STUDENT_EMAIL: ${{ secrets.LDT_STUDENT_EMAIL }}
          LDT_STUDENT_PASSWORD: ${{ secrets.LDT_STUDENT_PASSWORD }}
          LDT_GENERAL_EMAIL: ${{ secrets.LDT_GENERAL_EMAIL }}
          LDT_GENERAL_PASSWORD: ${{ secrets.LDT_GENERAL_PASSWORD }}

      - name: Post LDT results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: e2e/target/surefire-reports/*.xml
          check_name: LDT Results
          comment_title: LDT Results
          fail_on: test failures
