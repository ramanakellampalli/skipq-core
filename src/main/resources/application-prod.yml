spring:
  main:
    banner-mode: off

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.skipq: INFO

app:
  razorpay:
    key-id: ${RAZOR_PROD_ID}
    key-secret: ${RAZOR_PROD_SECRET}
    webhook-secret: ${RAZOR_WEBHOOK_SECRET_PROD}

jobs:
  scheduled-dispatch:
    enabled: true
    cron: "0 * 9-16 * * *"
