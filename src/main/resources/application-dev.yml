spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      connection-timeout: 20000
      max-lifetime: 180000
      keepalive-time: 60000

  jpa:
    show-sql: true

otp:
  bypass: true
  fixed-code: "123456"

logging:
  level:
    root: WARN
    com.skipq: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
