spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
      connection-timeout: 20000

  jpa:
    show-sql: true

otp:
  bypass: true
  fixed-code: "123456"

logging:
  level:
    root: WARN
    com.skipq: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

swagger:
  enabled: true

jobs:
  scheduled-dispatch:
    enabled: false
